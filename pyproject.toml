[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "archeon"
version = "10.0.0.dev0"
description = "Lightweight, modular ARCHEON assistant core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
benchmark = ["psutil==7.2.2"]
voice = [
  "sounddevice==0.5.6",
  "vosk==0.3.45",
  "webrtcvad-wheels==2.0.14",
  "comtypes==1.4.16",
]
media = [
  "miniaudio==1.71",
  "pillow==12.3.0",
  "tinytag==2.3.0",
]

[project.scripts]
archeon = "archeon.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archeon.ui" = ["*.html", "*.css", "*.js", "*.png", "*.ico", "*.wav", "*.mp3", "locales/*.json"]
