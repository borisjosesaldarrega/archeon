plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def rootEnvironment = new Properties()
def rootEnvironmentFile = rootProject.file("../../.env.local")
if (rootEnvironmentFile.exists()) {
    rootEnvironmentFile.withInputStream { rootEnvironment.load(it) }
}
def escapeBuildValue = { value -> (value ?: "").replace("\\", "\\\\").replace('"', '\\"') }
def supabaseUrl = localProperties.getProperty("archeon.supabaseUrl") ?: rootEnvironment.getProperty("ARCHEON_SUPABASE_URL") ?: ""
def publishableKey = localProperties.getProperty("archeon.supabasePublishableKey") ?: rootEnvironment.getProperty("ARCHEON_SUPABASE_PUBLISHABLE_KEY") ?: ""
def apiBaseUrl = supabaseUrl ? "${supabaseUrl.replaceAll('/+$', '')}/functions/v1/archeon-mobile-api" : ""

android {
    namespace "com.dzknight.archeon.mobile"
    compileSdk 35
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.dzknight.archeon.mobile"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0-standalone"
        buildConfigField "String", "ARCHEON_API_BASE_URL", "\"${escapeBuildValue(apiBaseUrl)}\""
        buildConfigField "String", "ARCHEON_SUPABASE_PUBLISHABLE_KEY", "\"${escapeBuildValue(publishableKey)}\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [rootProject.file("../../src/archeon/ui")]
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
