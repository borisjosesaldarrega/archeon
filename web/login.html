<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archeon Access</title>
    <style>
        :root { 
            --bg: #050505; --text: #eee; --accent: #00f3ff; 
            --accent-dim: rgba(0, 243, 255, 0.1); --error: #ff2a6d; 
            --panel: rgba(20, 20, 20, 0.95); --border: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; height: 100vh; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #bg-effect { position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #111 0%, #000 90%); }
        .container { width: 100%; max-width: 400px; padding: 40px; background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 20px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        h1 { margin: 0 0 10px 0; font-weight: 200; letter-spacing: 6px; text-transform: uppercase; font-size: 2rem; color: #fff; }
        .subtitle { font-size: 0.8rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; opacity: 0.8; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.3); }
        button { width: 100%; padding: 14px; margin-top: 20px; background: linear-gradient(135deg, var(--accent), #00aaff); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--accent-dim); }
        button.secondary { background: transparent; border: 1px solid #444; color: #888; }
        button.secondary:hover { border-color: #fff; color: #fff; box-shadow: none; }
        .link { font-size: 0.8em; color: var(--accent); cursor: pointer; margin-top: 20px; display: inline-block; opacity: 0.8; }
        .link:hover { text-decoration: underline; opacity: 1; }
        .hidden { display: none; }
        .error { color: var(--error); margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
        .checkbox-container { display: flex; align-items: center; margin-top: 15px; font-size: 0.85rem; color: #aaa; justify-content: flex-start; }
        .checkbox-container input { width: auto; margin-right: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="bg-effect"></div>
    <div class="container">
        <h1>Archeon</h1>
        <div class="subtitle">Neural Interface System</div>

        <div id="view-login">
            <form onsubmit="doLogin(event)">
                <input type="email" id="login-email" placeholder="Correo Electrónico" required>
                <input type="password" id="login-pass" placeholder="Contraseña" required>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Mantener sesión activa</label>
                </div>

                <button type="submit" id="btn-login">Iniciar Sesión</button>
                <button type="button" class="secondary" onclick="guestLogin()">Modo Invitado</button>
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <div class="link" onclick="switchView('recover-step1')">Recuperar Clave</div>
                    <div class="link" onclick="switchView('register-step1')">Crear Cuenta</div>
                </div>
            </form>
        </div>

        <div id="view-register-step1" class="hidden">
            <h3>Nuevo Usuario</h3>
            <p style="color:#888; font-size:0.9rem;">Paso 1: Validación de Correo</p>
            <input type="email" id="reg-email" placeholder="Tu Correo Electrónico">
            <button onclick="sendCode('register')" id="btn-code-reg">Enviar Código</button>
            <div class="link" onclick="switchView('login')">← Cancelar</div>
        </div>

        <div id="view-register-step2" class="hidden">
            <h3>Finalizar Registro</h3>
            <p style="color:#888; font-size:0.9rem;">Paso 2: Credenciales</p>
            
            <input type="text" id="reg-code" placeholder="CÓDIGO (6 DÍGITOS)" maxlength="6" style="text-align:center; letter-spacing:3px; color:var(--accent); font-weight:bold;">
            
            <input type="text" id="reg-user" placeholder="Nombre de Usuario" maxlength="20">
            
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <input type="password" id="reg-pass-conf" placeholder="Confirmar Contraseña">
            
            <button onclick="doRegister()" id="btn-reg">Registrarme</button>
            <div class="link" onclick="switchView('register-step1')">← Atrás</div>
        </div>

        <div id="view-recover-step1" class="hidden">
            <h3>Recuperar Acceso</h3>
            <input type="email" id="rec-email" placeholder="Correo de la cuenta">
            <button onclick="sendCode('recover')" id="btn-code-rec">Enviar Código</button>
            <div class="link" onclick="switchView('login')">← Cancelar</div>
        </div>

        <div id="view-recover-step2" class="hidden">
            <h3>Nueva Contraseña</h3>
            <input type="text" id="rec-code" placeholder="CÓDIGO RECIBIDO" maxlength="6" style="text-align:center; letter-spacing:3px;">
            <input type="password" id="rec-pass" placeholder="Nueva Contraseña">
            <button onclick="doRecover()" id="btn-recover">Cambiar Clave</button>
            <div class="link" onclick="switchView('recover-step1')">Reenviar</div>
        </div>

        <div id="msg" class="error"></div>
    </div>

    <script>
        let currentEmail = "";

        // --- SISTEMA DE SESIÓN AUTOMÁTICA (Persistencia) ---
        (async () => {
            // 1. Revisar si hay un token guardado
            const token = localStorage.getItem('archeon_token') || sessionStorage.getItem('archeon_token');
            const savedEmail = localStorage.getItem('archeon_email');

            // Autocompletar email si existe
            if(savedEmail) {
                document.getElementById('login-email').value = savedEmail;
                document.getElementById('remember-me').checked = true;
            }

            if(token) {
                console.log("Verificando sesión activa...");
                try {
                    // Validar token con el backend
                    const r = await fetch('/api/me', { headers: {'X-Auth-Token': token} });
                    if(r.ok) {
                        window.location.replace('/dashboard'); // Token válido -> Entrar
                    } else {
                        // Token expirado o inválido -> Limpiar
                        localStorage.removeItem('archeon_token');
                        sessionStorage.removeItem('archeon_token');
                    }
                } catch { console.log("Servidor offline"); }
            }
        })();

        // --- FUNCIONES ---
        function switchView(id) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-'+id).classList.remove('hidden');
            showMsg("");
        }

        function showMsg(txt) { document.getElementById('msg').innerText = txt; }
        
        function setLoading(btnId, active) {
            const btn = document.getElementById(btnId);
            if(active) { btn.dataset.txt = btn.innerText; btn.innerText = "..."; btn.disabled = true; }
            else { btn.innerText = btn.dataset.txt; btn.disabled = false; }
        }

        async function doLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            const remember = document.getElementById('remember-me').checked;

            setLoading('btn-login', true);
            try {
                const r = await fetch('/api/login', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email, password: pass})
                });
                const d = await r.json();

                if(d.ok) {
                    // Lógica "Mantener sesión"
                    if(remember) {
                        localStorage.setItem('archeon_token', d.token); // Persistente
                        localStorage.setItem('archeon_email', email);
                    } else {
                        sessionStorage.setItem('archeon_token', d.token); // Solo esta pestaña
                        localStorage.removeItem('archeon_token');
                    }
                    window.location.replace('/dashboard');
                } else { showMsg(d.error); }
            } catch { showMsg("Error de conexión"); }
            setLoading('btn-login', false);
        }

        async function guestLogin() {
            if(!confirm("El modo invitado no guarda recuerdos a largo plazo. ¿Continuar?")) return;
            try {
                const r = await fetch('/api/guest', {method:'POST'});
                const d = await r.json();
                if(d.ok) {
                    sessionStorage.setItem('archeon_token', d.token);
                    window.location.replace('/dashboard');
                }
            } catch { showMsg("Error iniciando invitado"); }
        }

        async function sendCode(mode) {
            const emailId = mode === 'register' ? 'reg-email' : 'rec-email';
            const email = document.getElementById(emailId).value.trim();
            if(!email.includes('@')) return showMsg("Email inválido");

            const btnId = mode === 'register' ? 'btn-code-reg' : 'btn-code-rec';
            setLoading(btnId, true);
            
            try {
                const r = await fetch('/api/send-code', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email, mode})
                });
                const d = await r.json();
                if(d.ok) {
                    currentEmail = email;
                    switchView(mode === 'register' ? 'register-step2' : 'recover-step2');
                } else { showMsg(d.error); }
            } catch { showMsg("Error enviando código"); }
            setLoading(btnId, false);
        }

        async function doRegister() {
            const code = document.getElementById('reg-code').value.trim();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const passConf = document.getElementById('reg-pass-conf').value;

            // --- VALIDACIONES PROFESIONALES ---
            if(code.length < 6) return showMsg("Falta el código de verificación");
            if(!user) return showMsg("El nombre de usuario es obligatorio");
            if(pass.length < 6) return showMsg("La contraseña es muy corta (mín 6)");
            if(pass !== passConf) return showMsg("Las contraseñas no coinciden");

            setLoading('btn-reg', true);
            try {
                // 1. Verificar Código
                const v = await fetch('/api/verify-code', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email: currentEmail, code: code})
                });
                const vRes = await v.json();
                if(!vRes.ok) throw new Error(vRes.error);

                // 2. Crear Usuario (Enviando también el USERNAME)
                const r = await fetch('/api/register', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email: currentEmail, password: pass, user_name: user})
                });
                const d = await r.json();

                if(d.ok) {
                    alert("¡Registro exitoso! Iniciando sesión...");
                    // Auto-login tras registro
                    document.getElementById('login-email').value = currentEmail;
                    document.getElementById('login-pass').value = pass;
                    document.getElementById('btn-login').click();
                } else { showMsg(d.error); }

            } catch(e) { showMsg(e.message || "Error en registro"); }
            setLoading('btn-reg', false);
        }
        
        // La recuperación de contraseña se mantiene igual...
        async function doRecover() {
            const code = document.getElementById('rec-code').value.trim();
            const pass = document.getElementById('rec-pass').value;
            if(!code || !pass) return showMsg("Faltan datos");

            setLoading('btn-recover', true);
            try {
                const v = await fetch('/api/verify-code', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({email: currentEmail, code, mode:'recover'})
                });
                if(!(await v.json()).ok) throw new Error("Código inválido");

                const r = await fetch('/api/reset-password', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({email: currentEmail, password: pass})
                });
                if((await r.json()).ok) {
                    alert("Contraseña cambiada"); switchView('login');
                } else showMsg("Error al cambiar clave");
            } catch(e) { showMsg(e.message); }
            setLoading('btn-recover', false);
        }
    </script>
</body>
</html>
